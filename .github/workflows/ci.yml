name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    name: ${{ matrix.os }} ${{ matrix.config }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, config: Release, flags: "" }
          - { os: ubuntu-latest, config: Debug, flags: "-fsanitize=address,undefined -fno-omit-frame-pointer" }
          - { os: macos-latest, config: Release, flags: "" }
          - { os: windows-latest, config: Release, flags: "" }
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        shell: bash
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.config }} -DCMAKE_CXX_FLAGS="${{ matrix.flags }}"
      - name: Build
        run: cmake --build build --config ${{ matrix.config }} --parallel
      - name: Test
        run: ctest --test-dir build -C ${{ matrix.config }} --output-on-failure

  android-release:
    name: android release bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools build-tools;36.0.0 platforms;android-36"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.50.0"
          channel: stable
          cache: true
      - name: Throwaway upload key
        shell: bash
        run: |
          # A short-lived key that exists only in this job; --non-strict accepts it.
          pass="ci-$(openssl rand -hex 16)"
          keytool -genkeypair -noprompt -keystore "$RUNNER_TEMP/ci-upload.jks" \
            -storepass "$pass" -keypass "$pass" -alias upload \
            -keyalg RSA -keysize 2048 -validity 2 -dname "CN=Humspan CI"
          {
            echo "storeFile=$RUNNER_TEMP/ci-upload.jks"
            echo "storePassword=$pass"
            echo "keyAlias=upload"
            echo "keyPassword=$pass"
          } > app-ui/android/key.properties
      - name: Build release bundle
        working-directory: app-ui
        run: flutter build appbundle --release
      - name: Check release bundle
        run: python3 app-ui/tool/check_release_bundle.py --non-strict app-ui/build/app/outputs/bundle/release/app-release.aab
      - name: Self-test the bundle check
        run: python3 app-ui/tool/test_check_release_bundle.py
