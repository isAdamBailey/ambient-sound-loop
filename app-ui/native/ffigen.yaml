# Regenerate with `dart run ffigen --config ffigen.yaml` from app-ui/native.
name: AmbientNativeBindings
description: |
  Bindings for core-cpp/include/ambient_engine.h and
  platform-audio/player/ambient_player.h.

  Regenerate with `dart run ffigen --config ffigen.yaml`.
output: 'lib/src/ambient_native_bindings.g.dart'
headers:
  entry-points:
    - '../../core-cpp/include/ambient_engine.h'
    - '../../platform-audio/player/ambient_player.h'
  include-directives:
    - '../../core-cpp/include/ambient_engine.h'
    - '../../platform-audio/player/ambient_player.h'
compiler-opts:
  - '-I../../core-cpp/include'
ffi-native:
  asset-id: 'package:ambient_native/ambient_native.dart'
functions:
  include:
    - 'ambient_.*'
comments:
  style: any
  length: full
