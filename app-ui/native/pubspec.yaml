name: ambient_native
description: "Native audio layer for the session screen: libambientsynth plus a miniaudio output stream, built by a Dart build hook, with ffigen bindings."
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.14.0

dependencies:
  code_assets: ^2.2.0
  crypto: ^3.0.6
  ffi: ^2.1.4
  hooks: ^2.2.0
  logging: ^1.3.0
  native_toolchain_c: ^0.19.6

dev_dependencies:
  ffigen: ^23.0.0
  flutter_lints: ^6.0.0
  test: ^1.28.0
